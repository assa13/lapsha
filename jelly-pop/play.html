<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#174fbd"><title>Jelly Pop</title><style>:root{
  font-family:Inter,ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;
  color:#f6f8ff;background:#0b1020;font-synthesis:none;
}
*{box-sizing:border-box}
html,body,#app{margin:0;width:100%;height:100%;overflow:hidden}
body{display:grid;place-items:center;background:#05070d}
button{font:inherit;border:0;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid rgba(255,255,255,.85);outline-offset:3px}
#game{
  height:100dvh;width:min(100vw,46.0251dvh);position:relative;overflow:hidden;
  background:linear-gradient(180deg,#134FBD 0%,#2D53B6 72%,#3767CD 100%);
  touch-action:none;user-select:none;isolation:isolate;
}
#game::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
  background:linear-gradient(180deg,rgba(4,16,52,.12),transparent 22%,transparent 72%,rgba(11,38,107,.14));
  mix-blend-mode:multiply;
}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1;touch-action:none}
#hud{
  position:absolute;z-index:8;left:5.2%;right:5.2%;top:max(2.8%,env(safe-area-inset-top));
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;
}
.brand{display:grid;gap:.8cqw}
.eyebrow{font-size:2.2cqw;letter-spacing:.18em;text-transform:uppercase;opacity:.58;font-weight:800}
.brand strong{font-size:5.2cqw;line-height:.96;letter-spacing:-.045em;font-weight:850}
.stats{display:flex;gap:1.2cqw}
.pill{
  min-width:14cqw;padding:1.7cqw 2.6cqw;border-radius:5cqw;
  background:rgba(13,45,119,.45);border:1px solid rgba(224,237,255,.15);
  backdrop-filter:blur(10px);text-align:center;
}
.pill span{display:block;font-size:1.75cqw;opacity:.55;letter-spacing:.08em;text-transform:uppercase}
.pill b{display:block;font-size:3.7cqw;line-height:1.15;font-variant-numeric:tabular-nums}
#combo-pill[data-hot="true"]{background:rgba(118,68,147,.38)}
#hint{
  position:absolute;z-index:6;top:25%;left:11%;right:11%;text-align:center;pointer-events:none;
  transition:opacity .5s ease,transform .5s ease;
}
#hint.hidden{opacity:0;transform:translateY(-10px)}
#hint strong{display:block;font-size:5.2cqw;line-height:1.05;font-weight:850;letter-spacing:-.035em}
#hint span{display:block;margin-top:1.7cqw;font-size:2.7cqw;line-height:1.45;opacity:.58}
#bank{
  position:absolute;z-index:10;left:5%;right:5%;bottom:max(2.8%,env(safe-area-inset-bottom));
  height:7.2%;display:flex;gap:2.2cqw;align-items:stretch;
}
.balance{
  flex:1;min-width:0;border-radius:5cqw;background:rgba(22,69,157,.62);
  border:1px solid rgba(220,235,255,.13);backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:space-between;padding:0 4.2cqw;
}
.balance span{font-size:2.2cqw;opacity:.55;letter-spacing:.1em;text-transform:uppercase}
.balance strong{font-size:5.8cqw;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.icon-btn{
  width:16.5cqw;border-radius:5cqw;background:rgba(22,69,157,.72);
  border:1px solid rgba(220,235,255,.14);backdrop-filter:blur(12px);
  display:grid;place-items:center;font-size:3.1cqw;font-weight:800;
}
.icon-btn:active{transform:scale(.96)}
#shop{
  position:absolute;inset:0;z-index:20;background:rgba(10,34,88,.82);
  backdrop-filter:blur(16px);padding:6% 5% 14%;overflow:auto;
}
#shop[hidden]{display:none}
.shop-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5cqw}
.shop-title small{display:block;font-size:2.2cqw;opacity:.55;letter-spacing:.16em;text-transform:uppercase}
.shop-title h2{margin:.6cqw 0 0;font-size:8cqw;letter-spacing:-.055em}
#close-shop{
  width:10cqw;height:10cqw;border-radius:50%;background:rgba(255,255,255,.09);font-size:5cqw
}
.upgrade-grid{display:grid;gap:2.4cqw}
.upgrade{
  width:100%;text-align:left;padding:4.1cqw;border-radius:4.3cqw;
  background:rgba(20,61,139,.78);border:1px solid rgba(203,224,255,.14);
  display:grid;grid-template-columns:1fr auto;gap:2.5cqw;align-items:center;
}
.upgrade:active:not(:disabled){transform:scale(.985)}
.upgrade:disabled{opacity:.43}
.upgrade .name{font-size:3.6cqw;font-weight:820}
.upgrade .desc{display:block;margin-top:1cqw;font-size:2.45cqw;line-height:1.4;opacity:.6}
.upgrade .price{font-size:3.35cqw;font-weight:820;white-space:nowrap}
.upgrade .level{display:block;margin-top:.8cqw;font-size:2cqw;opacity:.45}
.shop-note{margin:4cqw 1cqw 0;font-size:2.3cqw;line-height:1.5;opacity:.5}
#toast{
  position:absolute;z-index:30;left:12%;right:12%;top:14%;padding:2.6cqw 4cqw;
  border-radius:4cqw;background:rgba(13,42,105,.86);border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(10px);text-align:center;font-size:2.8cqw;font-weight:760;
  opacity:0;transform:translateY(-10px);transition:.22s ease;pointer-events:none;
}
#toast.visible{opacity:1;transform:none}
.pop-label{
  position:absolute;z-index:7;pointer-events:none;font-weight:900;font-size:5cqw;
  text-shadow:0 2px 14px rgba(0,0,0,.18);animation:floatUp .85s ease-out forwards;
}
@keyframes floatUp{
  0%{opacity:0;transform:translate(-50%,-15%) scale(.8)}
  18%{opacity:1;transform:translate(-50%,-45%) scale(1.05)}
  100%{opacity:0;transform:translate(-50%,-150%) scale(.9)}
}
@media(prefers-reduced-motion:reduce){.pop-label{animation-duration:.12s}}
</style></head><body><div id="app"></div><script>const COLORS=[
  {name:'Coral',rgb:[255,122,137]},
  {name:'Blue',rgb:[108,190,255]},
  {name:'Honey',rgb:[255,198,105]},
  {name:'Mint',rgb:[112,224,178]},
  {name:'Lilac',rgb:[184,137,255]}
];
const SAVE_KEY='jelly-pop-save-v1';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rgba=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const mix=(a,b,t)=>a.map((v,i)=>lerp(v,b[i],t));
const fmt=n=>n<1000?String(Math.floor(n)):n<1e6?(n/1e3).toFixed(n<1e4?1:0)+'K':(n/1e6).toFixed(1)+'M';

const fresh=()=>({v:1,coins:0,spawn:0,value:0,auto:0,rare:0,pops:0,lastSeen:Date.now()});
function load(){
  try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));return s&&s.v===1?{...fresh(),...s}:fresh();}
  catch{return fresh();}
}
let save=load();
const persist=()=>{save.lastSeen=Date.now();localStorage.setItem(SAVE_KEY,JSON.stringify(save));};

document.querySelector('#app').innerHTML=`
<main id="game">
  <canvas id="scene"></canvas>
  <header id="hud">
    <div class="brand"><span class="eyebrow">soft idle</span><strong>JELLY POP</strong></div>
    <div class="stats">
      <div class="pill"><span>blocks</span><b id="count">0</b></div>
      <div class="pill" id="combo-pill"><span>combo</span><b id="combo">×1.0</b></div>
    </div>
  </header>
  <div id="hint"><strong>Лопай желе.<br>Смешивай цвета.</strong><span>Соседние блоки впитывают цвет и массу.<br>Редкие смеси дают больший множитель.</span></div>
  <div id="toast"></div>
  <footer id="bank">
    <div class="balance"><span>gel</span><strong id="coins">0</strong></div>
    <button class="icon-btn" id="shop-button" type="button">SHOP</button>
  </footer>
  <section id="shop" hidden>
    <div class="shop-top">
      <div class="shop-title"><small>workshop</small><h2>Улучшения</h2></div>
      <button id="close-shop" type="button" aria-label="Закрыть">×</button>
    </div>
    <div class="upgrade-grid" id="upgrade-grid"></div>
    <p class="shop-note">Автолопание выбирает спокойные одиночные блоки и не ломает ручные комбинации.</p>
  </section>
</main>`;

const game=document.querySelector('#game');
const canvas=document.querySelector('#scene');
const ctx=canvas.getContext('2d',{alpha:true});
const coinsEl=document.querySelector('#coins');
const countEl=document.querySelector('#count');
const comboEl=document.querySelector('#combo');
const comboPill=document.querySelector('#combo-pill');
const hint=document.querySelector('#hint');
const shop=document.querySelector('#shop');
const shopButton=document.querySelector('#shop-button');
const closeShop=document.querySelector('#close-shop');
const upgradeGrid=document.querySelector('#upgrade-grid');
const toast=document.querySelector('#toast');

let W=0,H=0,dpr=1,last=performance.now(),spawnClock=0,autoClock=0,combo=1,comboTimer=0;
const blocks=[],drops=[],streams=[];
let id=1;

function resize(){
  const r=game.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.max(1,Math.round(W*dpr));canvas.height=Math.max(1,Math.round(H*dpr));
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
new ResizeObserver(resize).observe(game);resize();

class Jelly{
  constructor(x,y,colorIndex,rare=false){
    this.id=id++;this.x=x;this.y=y;this.vx=(Math.random()-.5)*14;this.vy=8+Math.random()*18;
    this.colorIndex=colorIndex;this.color=COLORS[colorIndex].rgb.slice();this.rare=rare;
    this.base=W*(rare?.092:.073+Math.random()*.014);this.mass=rare?1.35:1;
    this.angle=(Math.random()-.5)*.14;this.spin=(Math.random()-.5)*.18;
    this.sx=1;this.sy=1;this.hit=0;this.age=0;this.phase=Math.random()*Math.PI*2;
  }
  get r(){return this.base*Math.sqrt(this.mass);}
}

function spawn(initial=false){
  if(blocks.length>36)return;
  const rare=Math.random()<.02+save.rare*.012;
  const ci=rare?Math.floor(Math.random()*COLORS.length):Math.floor(Math.random()*4);
  const r=W*(rare?.092:.078);
  const x=r*1.4+Math.random()*(W-r*2.8);
  const b=new Jelly(x,-r*1.7,ci,rare);
  if(initial){b.y=H*(.32+Math.random()*.42);b.vy=0;}
  blocks.push(b);
}
for(let i=0;i<8;i++)spawn(true);

function showToast(text){
  toast.textContent=text;toast.classList.add('visible');
  clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('visible'),1200);
}
function rewardLabel(x,y,text,color){
  const el=document.createElement('div');el.className='pop-label';el.textContent=text;
  el.style.left=x+'px';el.style.top=y+'px';el.style.color=rgba(color,.98);
  game.appendChild(el);setTimeout(()=>el.remove(),900);
}
function burst(x,y,color,n=10){
  for(let i=0;i<n;i++)drops.push({x,y,vx:(Math.random()-.5)*100,vy:(Math.random()-.8)*110,life:.55+Math.random()*.25,r:2+Math.random()*4,color});
}
function colorBonus(a,b){
  if(a===b)return 1;
  const d=Math.abs(a-b);
  return 1.18+(d%3)*.08;
}
function popBlock(b,auto=false){
  const at=blocks.indexOf(b);if(at<0)return;
  const near=blocks.filter(o=>o!==b).map(o=>({o,d:Math.hypot(o.x-b.x,o.y-b.y)})).sort((a,b)=>a.d-b.d).slice(0,3);
  let local=1;
  for(const {o,d} of near){
    const reach=(b.r+o.r)*2.15;if(d>reach)continue;
    const different=o.colorIndex!==b.colorIndex;
    if(different)local=Math.max(local,colorBonus(o.colorIndex,b.colorIndex));
    const t=clamp(1-d/reach,.16,.48);
    o.mass=clamp(o.mass+b.mass*t*.18,.75,2.25);
    o.color=mix(o.color,b.color,different?.34:.14);
    streams.push({x1:b.x,y1:b.y,x2:o.x,y2:o.y,color:b.color.slice(),life:.42,max:.42,width:Math.max(5,b.r*.16)});
    const nx=(o.x-b.x)/(d||1),ny=(o.y-b.y)/(d||1);
    o.vx+=nx*34*t;o.vy+=ny*22*t;o.hit=Math.max(o.hit,.75);
    if(different&&Math.random()<.35)o.colorIndex=b.colorIndex;
  }
  combo=clamp(combo*(auto?1.02:1.06)*local,1,12);comboTimer=2.5;
  const reward=Math.max(1,Math.round((b.rare?18:6)*(1+save.value*.34)*combo));
  save.coins+=reward;save.pops++;blocks.splice(at,1);
  burst(b.x,b.y,b.color,b.rare?16:10);rewardLabel(b.x,b.y,'+'+reward,b.color);
  hint.classList.add('hidden');persist();
}

function physics(dt){
  const floor=H*.875,left=W*.055,right=W*.945,g=540;
  for(const b of blocks){
    b.age+=dt;b.vy+=g*dt;b.vx*=Math.pow(.991,dt*60);b.spin*=Math.pow(.986,dt*60);
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.angle+=b.spin*dt;
    const r=b.r;
    if(b.x-r<left){b.x=left+r;b.vx=Math.abs(b.vx)*.42;b.hit=.45}
    if(b.x+r>right){b.x=right-r;b.vx=-Math.abs(b.vx)*.42;b.hit=.45}
    if(b.y+r>floor){
      const impact=Math.abs(b.vy);b.y=floor-r;b.vy=-impact*.12;
      if(impact<40)b.vy=0;b.vx*=.84;b.spin*=.72;b.hit=Math.max(b.hit,clamp(impact/400,.14,.9));
    }
  }
  for(let pass=0;pass<3;pass++)for(let i=0;i<blocks.length;i++)for(let j=i+1;j<blocks.length;j++){
    const a=blocks[i],b=blocks[j],dx=b.x-a.x,dy=b.y-a.y;
    const d=Math.hypot(dx,dy)||.001,min=(a.r+b.r)*.82;if(d>=min)continue;
    const nx=dx/d,ny=dy/d,over=min-d,total=a.mass+b.mass;
    a.x-=nx*over*(b.mass/total)*.5;a.y-=ny*over*(b.mass/total)*.5;
    b.x+=nx*over*(a.mass/total)*.5;b.y+=ny*over*(a.mass/total)*.5;
    const rvx=b.vx-a.vx,rvy=b.vy-a.vy,sep=rvx*nx+rvy*ny;
    if(sep<0){const imp=-sep*.18;a.vx-=nx*imp*b.mass/total;a.vy-=ny*imp*b.mass/total;b.vx+=nx*imp*a.mass/total;b.vy+=ny*imp*a.mass/total;}
    const s=clamp(over/min*3.0,.05,.9);
    a.hit=Math.max(a.hit,s);b.hit=Math.max(b.hit,s);
    a.sx=lerp(a.sx,1+Math.abs(nx)*s*.35,.5);a.sy=lerp(a.sy,1-Math.abs(ny)*s*.28,.5);
    b.sx=lerp(b.sx,1+Math.abs(nx)*s*.35,.5);b.sy=lerp(b.sy,1-Math.abs(ny)*s*.28,.5);
  }
  for(const b of blocks){
    b.hit=Math.max(0,b.hit-dt*2.2);
    const wobble=Math.sin(b.age*5+b.phase)*.014*(1+b.hit*2.4);
    b.sx=lerp(b.sx,1+wobble,clamp(dt*7,0,1));b.sy=lerp(b.sy,1-wobble,clamp(dt*7,0,1));
  }
}

function rounded(x,y,w,h,r){
  const q=Math.min(r,w*.45,h*.45);ctx.beginPath();ctx.moveTo(x+q,y);
  ctx.arcTo(x+w,y,x+w,y+h,q);ctx.arcTo(x+w,y+h,x,y+h,q);ctx.arcTo(x,y+h,x,y,q);ctx.arcTo(x,y,x+w,y,q);ctx.closePath();
}
function drawJelly(b){
  ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.angle);
  ctx.scale(clamp(b.sx*(1+b.hit*.05),.8,1.25),clamp(b.sy*(1-b.hit*.05),.74,1.2));
  const s=b.r*1.58,c=s*.28;
  const grad=ctx.createLinearGradient(-s*.4,-s*.55,s*.4,s*.5);
  grad.addColorStop(0,rgba(mix(b.color,[255,255,255],.22),.72));
  grad.addColorStop(.55,rgba(b.color,.56));
  grad.addColorStop(1,rgba(mix(b.color,[40,70,120],.16),.64));
  ctx.shadowColor='rgba(6,25,72,.16)';ctx.shadowBlur=b.r*.22;ctx.shadowOffsetY=b.r*.1;
  rounded(-s/2,-s/2,s,s,c);ctx.fillStyle=grad;ctx.fill();
  ctx.shadowColor='transparent';ctx.strokeStyle='rgba(250,253,255,.28)';ctx.lineWidth=Math.max(1,b.r*.02);ctx.stroke();
  const hi=ctx.createRadialGradient(-s*.17,-s*.19,0,-s*.17,-s*.19,s*.4);
  hi.addColorStop(0,'rgba(255,255,255,.34)');hi.addColorStop(.4,'rgba(255,255,255,.10)');hi.addColorStop(1,'rgba(255,255,255,0)');
  ctx.globalCompositeOperation='screen';rounded(-s*.38,-s*.39,s*.53,s*.4,c*.7);ctx.fillStyle=hi;ctx.fill();
  ctx.globalCompositeOperation='source-over';
  ctx.save();
  ctx.globalAlpha=.32;
  ctx.fillStyle='rgba(255,255,255,.55)';
  const bubbleR=Math.max(1.5,b.r*.035);
  ctx.beginPath();ctx.arc(-s*.15,s*.12,bubbleR,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(s*.13,s*.2,bubbleR*.72,0,Math.PI*2);ctx.fill();
  ctx.restore();
  if(b.rare){ctx.strokeStyle='rgba(255,255,255,.42)';ctx.lineWidth=b.r*.035;rounded(-s*.43,-s*.43,s*.86,s*.86,c*.84);ctx.stroke();}
  ctx.restore();
}
function render(){
  ctx.clearRect(0,0,W,H);
  for(let i=streams.length-1;i>=0;i--){
    const st=streams[i];st.life-=1/60;if(st.life<=0){streams.splice(i,1);continue;}
    const t=1-st.life/st.max,alpha=Math.sin(Math.PI*clamp(t,0,1))*.28;
    const mx=(st.x1+st.x2)/2,my=(st.y1+st.y2)/2-18*Math.sin(t*Math.PI);
    ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=rgba(st.color,.9);ctx.lineWidth=st.width*(1-t*.45);ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(st.x1,st.y1);ctx.quadraticCurveTo(mx,my,st.x2,st.y2);ctx.stroke();ctx.restore();
  }
  for(const b of [...blocks].sort((a,b)=>a.y-b.y))drawJelly(b);
  for(let i=drops.length-1;i>=0;i--){
    const p=drops[i];p.life-=1/60;if(p.life<=0){drops.splice(i,1);continue;}
    p.x+=p.vx/60;p.y+=p.vy/60;p.vy+=160/60;p.vx*=.986;
    ctx.globalAlpha=clamp(p.life/.8,0,1)*.72;ctx.fillStyle=rgba(p.color,.85);ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function hitFromPointer(e){
  const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  let hit=null,dist=Infinity;
  for(const b of blocks){const d=Math.hypot(x-b.x,y-b.y);if(d<b.r*.95&&d<dist){hit=b;dist=d;}}
  return hit;
}
canvas.addEventListener('pointerdown',e=>{if(!shop.hidden)return;const b=hitFromPointer(e);if(b)popBlock(b,false);});

const upgrades=[
  {id:'spawn',name:'Мягкий поток',desc:'Новые желе падают чаще.',base:70,scale:2.05,max:8},
  {id:'value',name:'Плотный сироп',desc:'Каждый лопнутый блок приносит больше GEL.',base:110,scale:2.15,max:8},
  {id:'auto',name:'Автопоп',desc:'Иногда лопает спокойный одиночный блок.',base:450,scale:2.5,max:5},
  {id:'rare',name:'Редкие оттенки',desc:'Повышает шанс крупного редкого желе.',base:800,scale:2.6,max:5}
];
const price=u=>save[u.id]>=u.max?null:Math.round(u.base*Math.pow(u.scale,save[u.id]||0));
function renderShop(){
  upgradeGrid.innerHTML='';
  for(const u of upgrades){
    const p=price(u),lvl=save[u.id]||0,b=document.createElement('button');b.type='button';b.className='upgrade';b.disabled=p===null||save.coins<p;
    b.innerHTML=`<span><span class="name">${u.name}</span><span class="desc">${u.desc}</span><span class="level">уровень ${lvl}/${u.max}</span></span><span class="price">${p===null?'MAX':fmt(p)+' GEL'}</span>`;
    b.addEventListener('click',()=>{const cost=price(u);if(cost===null||save.coins<cost)return;save.coins-=cost;save[u.id]++;persist();renderShop();updateHud();showToast(u.name+' улучшен');});
    upgradeGrid.appendChild(b);
  }
}
shopButton.addEventListener('click',()=>{shop.hidden=false;renderShop();});
closeShop.addEventListener('click',()=>{shop.hidden=true;});
function updateHud(){
  coinsEl.textContent=fmt(save.coins);countEl.textContent=String(blocks.length);
  comboEl.textContent='×'+combo.toFixed(combo<2?1:0);comboPill.dataset.hot=combo>1.3?'true':'false';
}
function frame(now){
  const dt=Math.min(.033,(now-last)/1000||.016);last=now;
  if(shop.hidden){
    spawnClock+=dt;const interval=Math.max(.42,1.45-save.spawn*.115);
    while(spawnClock>interval){spawnClock-=interval;spawn();}
    if(save.auto>0){
      autoClock+=dt;const gap=Math.max(2.8,9-save.auto*1.15);
      if(autoClock>gap&&blocks.length>5){autoClock=0;const pool=blocks.filter(b=>b.y>H*.28&&b.y<H*.82);if(pool.length)popBlock(pool[Math.floor(Math.random()*pool.length)],true);}
    }
    if(comboTimer>0)comboTimer-=dt;else combo=lerp(combo,1,clamp(dt*1.25,0,1));
    physics(dt);
  }
  render();updateHud();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setInterval(persist,5000);
window.addEventListener('pagehide',persist);
</script></body></html>
