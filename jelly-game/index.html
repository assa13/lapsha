<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Jelly Game</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101321;font-family:system-ui;color:white;touch-action:none}canvas{display:block}#ui{position:fixed;inset:14px 16px auto;display:flex;justify-content:space-between;pointer-events:none;font-weight:800;text-shadow:0 2px 8px #000}#hint{position:fixed;bottom:18px;width:100%;text-align:center;opacity:.65;pointer-events:none;font-size:13px}</style></head><body><div id="ui"><span id="score">0</span><span id="combo">COMBO x1</span></div><div id="hint">Тапай по желейкам одного цвета</div><canvas id="c"></canvas><script>
const c=document.querySelector('#c'),x=c.getContext('2d'),S=document.querySelector('#score'),C=document.querySelector('#combo');let W,H,dpr,balls=[],parts=[],score=0,combo=1,lastPop=0,t=0;
const cols=['#ff4f91','#55d8ff','#9b70ff','#63e6a7','#ffd35c'];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function spawn(){let r=22+Math.random()*13;balls.push({x:r+Math.random()*(W-r*2),y:-r,vx:(Math.random()-.5)*.6,vy:0,r,rr:r,c:cols[Math.random()*cols.length|0],sx:1,sy:1,a:1})}
setInterval(()=>{if(balls.length<26)spawn()},620);
function pop(i){let b=balls[i],now=performance.now();combo=now-lastPop<900?Math.min(combo+1,9):1;lastPop=now;score+=10*combo;S.textContent=score;C.textContent='COMBO x'+combo;for(let k=0;k<10;k++)parts.push({x:b.x,y:b.y,vx:(Math.random()-.5)*6,vy:(Math.random()-.7)*6,r:2+Math.random()*5,c:b.c,a:1});balls.splice(i,1)}
c.addEventListener('pointerdown',e=>{let q=c.getBoundingClientRect(),px=e.clientX-q.left,py=e.clientY-q.top;for(let i=balls.length-1;i>=0;i--){let b=balls[i],dx=px-b.x,dy=py-b.y;if(dx*dx+dy*dy<b.r*b.r*1.5){pop(i);break}}});
function frame(){requestAnimationFrame(frame);t+=.016;x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#171b31');g.addColorStop(1,'#090b13');x.fillStyle=g;x.fillRect(0,0,W,H);
for(let i=0;i<balls.length;i++){let b=balls[i];b.vy+=.16;b.x+=b.vx;b.y+=b.vy;if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*.7}if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)*.7}if(b.y>H-b.r-8){b.y=H-b.r-8;b.vy*=-.28;b.vx*=.96;b.sx=1.18;b.sy=.82}
for(let j=i+1;j<balls.length;j++){let a=balls[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy),m=b.r+a.r;if(d<m&&d){let nx=dx/d,ny=dy/d,p=(m-d)*.5;b.x-=nx*p;a.x+=nx*p;b.y-=ny*p;a.y+=ny*p;let rv=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;if(rv<0){let imp=-rv*.55;b.vx-=nx*imp;a.vx+=nx*imp;b.vy-=ny*imp;a.vy+=ny*imp}b.sx=a.sx=1.1;b.sy=a.sy=.9}}
b.sx+=(1-b.sx)*.12;b.sy+=(1-b.sy)*.12;drawJelly(b)}
for(let i=parts.length-1;i>=0;i--){let p=parts[i];p.vy+=.12;p.x+=p.vx;p.y+=p.vy;p.a-=.025;if(p.a<=0){parts.splice(i,1);continue}x.globalAlpha=p.a;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}x.globalAlpha=1}
function drawJelly(b){x.save();x.translate(b.x,b.y);x.scale(b.sx,b.sy);let r=b.r,w=r*1.75,h=r*1.75,rr=r*.48;x.shadowColor=b.c;x.shadowBlur=18;x.globalAlpha=.8;x.fillStyle=b.c;x.beginPath();x.roundRect(-w/2,-h/2,w,h,rr);x.fill();x.shadowBlur=0;let hi=x.createRadialGradient(-r*.28,-r*.35,1,-r*.1,-r*.15,r);hi.addColorStop(0,'rgba(255,255,255,.9)');hi.addColorStop(.28,'rgba(255,255,255,.2)');hi.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=hi;x.fill();x.restore();x.globalAlpha=1}
frame();</script></body></html>
